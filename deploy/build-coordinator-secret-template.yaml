# Template for the build coordinator's credentials. TEMPLATE ONLY — the real
# values are never committed.
#
# The keys are named exactly as the environment variables the coordinator reads,
# because the Deployment consumes this Secret with `envFrom.secretRef` rather
# than mapping each key by hand. Renaming a key here silently unsets the
# corresponding variable in the pod.
#
# Only credentials live here. Non-secret configuration (BUILD_WORKFLOW_REPO,
# BUILD_COORDINATOR_PUBLIC_URL, IMAGE_PREFIX, BUILD_COORDINATOR_DB, PORT) is set
# as plain `env` in gitops-lab/apps/tinycloud-platform/build-coordinator.yaml so
# it stays reviewable in git.
#
# BUILD_COORDINATOR_TOKEN must be byte-identical to the `token` key of the
# existing `build-coordinator-token` Secret, which the API uses to authenticate
# to the coordinator. If they diverge, every API call to the coordinator gets a
# 401 and the builds page goes blank. During the cutover, generate this Secret
# from the live env file on k3s-worker-1 rather than retyping the values:
#
#   sudo cat /etc/tinycloud/build-coordinator.env      # on k3s-worker-1
#   kubectl create secret generic build-coordinator-env -n tinycloud \
#     --from-literal=BUILD_COORDINATOR_TOKEN=... \
#     --from-literal=GITHUB_TOKEN=... \
#     --from-literal=GITHUB_USERNAME=sasiruLK
#
# Longer term this belongs in OCI Vault behind an ExternalSecret, like
# cloudflare-api-token in gitops-lab/argocd/oci-vault-store.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: build-coordinator-env
  namespace: tinycloud
type: Opaque
stringData:
  BUILD_COORDINATOR_TOKEN: replace-with-oci-vault-secret
  GITHUB_TOKEN: ghp_YOUR_TOKEN_HERE
  GITHUB_USERNAME: sasiruLK
